<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NanoServe WASM Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#07080c"/>
  <meta name="color-scheme" content="dark"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="bg-scene" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="noise"></div>
  </div>

  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">NS</div>
        <div>
          <h1>NanoServe</h1>
          <p>Browser WASM demo · CPU only</p>
        </div>
      </div>
      <div class="status-row">
        <span class="chip" id="chipStatus"><span class="chip-dot off"></span>Loading…</span>
        <span class="chip"><span class="chip-dot"></span>WASM demo</span>
        <span class="chip" id="chipModel"><span class="chip-dot off"></span>No model</span>
      </div>
    </header>

    <section class="panel glass">
      <h2 class="panel-title">Prompt</h2>
      <div class="prompt-wrap">
        <textarea id="prompt" placeholder="Ask anything…">Explain how buddy allocators work</textarea>
      </div>

      <h2 class="panel-title" style="margin-top:22px">Configuration</h2>
      <div class="controls-grid">
        <div class="field">
          <label for="tokens">Max tokens</label>
          <input id="tokens" type="number" value="24" min="1" max="128"/>
        </div>
      </div>

      <input id="fileInput" type="file" accept=".nanoq" hidden/>

      <div class="actions">
        <button class="btn btn-primary" id="go">Generate</button>
        <button class="btn btn-ghost" id="loadBtn">Load .nanoq file</button>
      </div>
    </section>

    <section class="panel glass output-panel">
      <h2 class="panel-title">Response</h2>
      <p class="output-text" id="out">Build WASM with ./scripts/build_wasm.sh then serve this folder.</p>
      <div class="meta-bar" id="meta"></div>
    </section>
  </main>

  <script src="nanoserve.js"></script>
  <script src="app.js"></script>
</body>
</html>
