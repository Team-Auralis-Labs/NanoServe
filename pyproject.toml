[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoserve"
version = "0.3.0"
description = "NanoServe — minimal LLM orchestrator with CPU/GPU compute backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "rich>=13.7",
    "gunicorn>=21.2",
]

[project.scripts]
nanoserve-quantizer = "nanoserve.quantizer.quantize:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanoserve*"]

[tool.setuptools.package-data]
nanoserve = ["py.typed"]
