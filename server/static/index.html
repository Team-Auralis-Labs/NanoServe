<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NanoServe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#07080c"/>
  <meta name="color-scheme" content="dark"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="bg-scene" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="noise"></div>
  </div>

  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">NS</div>
        <div>
          <h1>NanoServe</h1>
          <p>Multi-model quantized inference</p>
        </div>
      </div>
      <div class="status-row">
        <span class="chip" id="chipStatus"><span class="chip-dot"></span>Online</span>
        <span class="chip" id="chipGpu"><span class="chip-dot off"></span>CPU only</span>
        <span class="chip" id="chipModels"><span class="chip-dot"></span>0 models</span>
        <span class="chip" id="chipGguf"><span class="chip-dot off"></span>GGUF off</span>
      </div>
    </header>

    <section class="panel glass">
      <h2 class="panel-title">Prompt</h2>
      <div class="prompt-wrap">
        <textarea id="prompt" placeholder="Ask anything…">Explain how buddy allocators work</textarea>
      </div>

      <h2 class="panel-title" style="margin-top:22px">Configuration</h2>
      <div class="controls-grid">
        <div class="field">
          <label for="tokens">Max tokens</label>
          <input id="tokens" type="number" value="24" min="1" max="128"/>
        </div>
        <div class="field">
          <label for="device">Compute engine</label>
          <select id="device">
            <option value="cpu" selected>CPU</option>
            <option value="gpu">GPU</option>
            <option value="auto">Auto</option>
          </select>
        </div>
        <div class="field">
          <label for="model">Model</label>
          <select id="model"><option value="">Built-in demo (no model)</option></select>
        </div>
        <div class="field">
          <label for="format">Format</label>
          <select id="format">
            <option value="auto" selected>Auto</option>
            <option value="nanoq">Native (.nanoq)</option>
            <option value="gguf">GGUF</option>
          </select>
        </div>
        <div class="field">
          <label for="precision">Precision</label>
          <select id="precision">
            <option value="int8" selected>int8 · default</option>
            <option value="fp16">fp16</option>
            <option value="fp4">fp4</option>
            <option value="raw">raw · unquantized</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="go">Generate</button>
        <button class="btn btn-ghost" id="downloadBtn">Download model</button>
      </div>
    </section>

    <section class="panel glass output-panel">
      <h2 class="panel-title">Response</h2>
      <p class="output-text" id="out">Output will appear here.</p>
      <div class="meta-bar" id="meta"></div>
    </section>
  </main>

  <dialog id="dlDialog">
    <div class="modal glass">
      <h2>Download model</h2>
      <p>Pull weights from HuggingFace Hub or a direct URL.</p>
      <div class="field">
        <label for="dlSource">Source</label>
        <select id="dlSource">
          <option value="hf">HuggingFace</option>
          <option value="url">Direct URL</option>
        </select>
      </div>
      <div class="field">
        <label for="dlTarget">Repo ID or URL</label>
        <input id="dlTarget" type="text" placeholder="org/model or https://…"/>
      </div>
      <div class="field">
        <label for="dlFilename">Filename (optional)</label>
        <input id="dlFilename" type="text" placeholder="model.safetensors"/>
      </div>
      <div class="field">
        <label for="dlModelId">Local model ID (optional)</label>
        <input id="dlModelId" type="text" placeholder="my-model"/>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="dlConfirm">Download</button>
        <button class="btn btn-ghost" id="dlCancel">Cancel</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
